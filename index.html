<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSRS Skill Calculator & XP/GP Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#14100a;--panel:#2b2117;--panel-border:#6f5331;--gold:#ff981f;
  --text:#f3dec4;--muted:#b89a73;--positive:#48e245;--negative:#ff5b4f;
  --btn:#5b371c;--btn-hover:#7a4b24;--highlight:#3b2b1c;--parchment:#d8bd86;
  --stone:#1b1712;--rune-blue:#76c8ff;
}
body{
  background:
    radial-gradient(circle at 20% 0%,rgba(255,152,31,.12),transparent 28rem),
    linear-gradient(rgba(20,16,10,.92),rgba(20,16,10,.96)),
    repeating-linear-gradient(45deg,#17120b 0,#17120b 12px,#1f180f 12px,#1f180f 24px);
  color:var(--text);
  font-family:Georgia,'Times New Roman',serif;
  min-height:100vh;
}
a{color:var(--gold)}
h1{color:var(--gold);font-size:2rem;text-shadow:2px 2px 0 #000,0 0 8px rgba(255,152,31,.28);letter-spacing:.02em}
h2{color:var(--gold);font-size:1.3rem;margin-bottom:.5rem;text-shadow:1px 1px 0 #000}
h3{color:var(--gold);font-size:1.1rem;text-shadow:1px 1px 0 #000}
.container{max-width:1200px;margin:0 auto;padding:1rem}
header{
  background:
    linear-gradient(180deg,rgba(60,41,20,.96),rgba(18,14,9,.98)),
    repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 2px,transparent 2px,transparent 12px);
  border-bottom:4px ridge var(--panel-border);
  box-shadow:0 6px 18px rgba(0,0,0,.45);
  padding:1.2rem 0 1.4rem;
  text-align:center;
}
header h1{margin-bottom:1rem}
.osrs-logo{width:min(360px,80vw);height:auto;image-rendering:auto;filter:drop-shadow(3px 5px 2px #000);margin-bottom:.35rem}
.search-row{display:flex;justify-content:center;gap:.5rem;margin-bottom:.5rem;flex-wrap:wrap}
.search-row input{background:#0f0b07;border:2px ridge var(--panel-border);color:var(--text);padding:.6rem 1rem;border-radius:2px;font-size:1rem;width:280px;font-family:inherit}
.search-row input:focus{outline:none;border-color:var(--gold)}
.search-row button{background:linear-gradient(#7a4b24,#3f2613);color:var(--gold);border:2px ridge var(--panel-border);padding:.6rem 1.5rem;border-radius:2px;cursor:pointer;font-size:1rem;font-weight:700;font-family:inherit;text-shadow:1px 1px 0 #000}
.search-row button:hover{background:var(--btn-hover)}
#price-status{color:var(--muted);font-size:.8rem;margin-top:.4rem}
#error-msg{background:#3a1111;border:1px solid #662222;color:#ff6666;padding:.8rem 1rem;border-radius:4px;margin:1rem auto;max-width:600px;text-align:center}
#loading{text-align:center;color:var(--gold);padding:2rem;font-size:1.2rem}
.hidden{display:none!important}

/* Player Stats Grid */
#player-section{margin-top:1.5rem}
#player-header{display:flex;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
#player-header h2{margin:0}
.combat-level{background:var(--panel);border:2px ridge var(--panel-border);padding:.3rem .8rem;border-radius:2px;color:var(--gold);font-weight:600}
.quest-points{background:var(--panel);border:2px ridge var(--panel-border);padding:.3rem .8rem;border-radius:2px;color:var(--rune-blue)}
#stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.5rem}
.skill-card{background:linear-gradient(180deg,#332619,#221911);border:2px ridge var(--panel-border);border-radius:2px;padding:.6rem .8rem;cursor:pointer;display:flex;align-items:center;gap:.6rem;transition:all .15s;box-shadow:inset 0 1px rgba(255,255,255,.05)}
.skill-card:hover,.skill-card.active{border-color:var(--gold);background:linear-gradient(180deg,#4a341d,#2b1e12)}
.skill-icon{width:24px;height:24px;image-rendering:pixelated}
.skill-info{flex:1;min-width:0}
.skill-name{font-size:.85rem;color:var(--muted)}
.skill-level{font-size:1.1rem;font-weight:700;color:var(--text)}
.skill-xp{font-size:.7rem;color:var(--muted)}

/* Methods Section */
#methods-section{margin-top:1.5rem;background:linear-gradient(180deg,#2a2016,#19130d);border:4px ridge var(--panel-border);border-radius:2px;padding:1.2rem;box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,201,109,.08)}
.methods-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem;margin-bottom:1rem}
.methods-controls{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.methods-controls label{color:var(--muted);font-size:.85rem;cursor:pointer;display:flex;align-items:center;gap:.3rem}
.methods-controls select{background:#0f0b07;border:2px ridge var(--panel-border);color:var(--text);padding:.3rem .5rem;border-radius:2px;font-size:.85rem;font-family:inherit}
.methods-controls input[type=number]{background:#0f0b07;border:2px ridge var(--panel-border);color:var(--text);padding:.3rem .5rem;border-radius:2px;width:60px;font-size:.85rem;font-family:inherit}
#xp-info{background:rgba(216,189,134,.12);border:2px ridge var(--panel-border);border-radius:2px;padding:.8rem 1rem;margin-bottom:1rem;display:flex;gap:2rem;flex-wrap:wrap;font-size:.9rem}
#xp-info span{color:var(--muted)}
#xp-info strong{color:var(--text)}
.category-header{color:var(--gold);font-size:.95rem;font-weight:600;padding:.5rem .2rem;margin-top:.8rem;border-bottom:1px solid var(--panel-border)}
.category-header:first-child{margin-top:0}

/* Methods Table */
.methods-table{width:100%;border-collapse:collapse;font-size:.85rem;table-layout:fixed}
.methods-table col.col-method{width:20%}
.methods-table col.col-level{width:4%}
.methods-table col.col-xp{width:7%}
.methods-table col.col-cost{width:9%}
.methods-table col.col-gpxp{width:8%}
.methods-table col.col-net{width:8%}
.methods-table col.col-xphr{width:8%}
.methods-table col.col-actions{width:7%}
.methods-table col.col-time{width:8%}
.methods-table col.col-totalcost{width:9%}
.methods-table col.col-gphr{width:10%}
.methods-table th{text-align:center;color:var(--parchment);font-weight:700;padding:.55rem .45rem;border-bottom:2px ridge var(--panel-border);position:sticky;top:0;background:#1b130c;cursor:pointer;user-select:none;white-space:nowrap;text-shadow:1px 1px 0 #000;vertical-align:middle}
.methods-table th:first-child{text-align:left}
.methods-table th:hover{color:var(--gold)}
.methods-table td{padding:.55rem .45rem;border-bottom:1px solid rgba(111,83,49,.25);vertical-align:middle}
.methods-table tr:nth-child(odd) td{background:rgba(216,189,134,.025)}
.methods-table tr:hover td{background:rgba(255,152,31,.09)}
.methods-table tr.locked td{opacity:.4}
.positive{color:var(--positive)}
.negative{color:var(--negative)}
.neutral{color:var(--muted)}
.materials{font-size:.75rem;color:var(--muted);margin-top:.15rem}
.method-name{font-weight:500}
.skill-chip{display:inline-block;margin-left:.4rem;color:var(--rune-blue);font-size:.7rem;font-weight:700}
td.num{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}

/* No player state */
#no-player{text-align:center;padding:3rem 1rem;color:var(--muted)}
#no-player p{margin-bottom:.5rem}

/* Responsive */
@media(max-width:900px){
  .methods-table .hide-tablet{display:none}
  .methods-table{font-size:.78rem}
  .methods-table th,.methods-table td{padding:.4rem .3rem}
}
@media(max-width:768px){
  #stats-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .methods-header{flex-direction:column;align-items:flex-start}
  .methods-table{font-size:.75rem}
  .custom-xp-row{gap:.5rem}
  .custom-xp-row label{font-size:.8rem}
  .custom-xp-row input{width:65px;padding:.25rem .4rem;font-size:.8rem}
}
@media(max-width:600px){
  /* Table: switch to auto layout so hidden cols don't waste space */
  .methods-table{font-size:.72rem;table-layout:auto}
  .methods-table .hide-mobile{display:none}
  .methods-table .hide-tablet{display:none}
  .methods-table th,.methods-table td{padding:.4rem .3rem}
  .materials{display:none}
  .method-name{font-size:.75rem;line-height:1.25;word-break:break-word}

  /* Header & controls */
  h1{font-size:1.1rem;margin-bottom:.3rem!important}
  h2{font-size:1rem}
  .container{padding:.4rem}
  header{padding:.4rem 0 .5rem}
  header h1{display:none}
  header p{font-size:.68rem!important;margin-bottom:.4rem!important}
  .osrs-logo{width:min(220px,60vw)!important;margin-bottom:.2rem!important}
  #price-status{font-size:.68rem;margin-top:.3rem}
  #no-player{padding:1rem .5rem}
  #no-player h2{font-size:.95rem;margin-bottom:.2rem}
  #no-player p{font-size:.78rem}
  .search-row{flex-direction:row;align-items:stretch;gap:.3rem;padding:0 .3rem}
  .search-row input{flex:1;min-width:0;padding:.45rem .6rem;font-size:.85rem;width:auto}
  .search-row button{padding:.45rem .8rem;font-size:.85rem;white-space:nowrap}

  /* Methods section */
  #methods-section{padding:.7rem;border-width:2px}
  .methods-header{gap:.5rem;margin-bottom:.6rem}
  .methods-controls{gap:.5rem;width:100%}
  .methods-controls label{font-size:.78rem}
  .methods-controls select{font-size:.78rem;flex:1;min-width:0}
  .methods-controls input[type=number]{width:50px;font-size:.78rem;padding:.25rem .3rem}

  /* Custom XP inputs - stack vertically on small screens */
  .custom-xp-row{flex-direction:row;flex-wrap:wrap;gap:.4rem .6rem}
  .custom-xp-row label{font-size:.78rem;flex:1 1 auto;min-width:0}
  .custom-xp-row input{width:55px;padding:.2rem .3rem;font-size:.78rem}

  /* Bonus toggles */
  .bonus-toggles{gap:.3rem}
  .bonus-toggles label{font-size:.72rem;padding:.2rem .4rem}

  /* XP info */
  #xp-info{padding:.5rem .6rem;gap:.3rem .8rem;font-size:.78rem;flex-direction:row;flex-wrap:wrap}

  /* Skill tabs - compact wrapped grid on mobile */
  .skill-tabs{gap:2px!important;margin:.4rem 0 .2rem!important;flex-wrap:wrap!important;overflow-x:visible!important}
  .skill-tab{padding:.2rem .3rem;font-size:.6rem;gap:2px;flex-shrink:0;border-width:1px}
  .skill-tab img{width:13px;height:13px}

  /* Custom XP row */
  .custom-xp-row{gap:.3rem .4rem;align-items:center;flex-wrap:wrap}
  .custom-xp-row label{font-size:.72rem;white-space:nowrap;flex:0 0 auto}
  .custom-xp-row input{width:46px!important;padding:.2rem .2rem;font-size:.72rem}

  /* Category headers */
  .category-header{font-size:.82rem;padding:.35rem .1rem;margin-top:.5rem}
}
@media(max-width:480px){
  #stats-grid{grid-template-columns:repeat(3,1fr)}
  /* Further compact the XP info */
  #xp-info{font-size:.72rem;gap:.2rem .6rem}
  #xp-info div{white-space:nowrap}
}

/* Tabs for browsing without player */
.skill-tabs{display:flex;flex-wrap:wrap;gap:.3rem;margin:1.5rem 0 .5rem}
.skill-tab{background:linear-gradient(180deg,#332619,#21180f);border:2px ridge var(--panel-border);border-radius:2px;padding:.35rem .7rem;cursor:pointer;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:.3rem}
.skill-tab:hover,.skill-tab.active{border-color:var(--gold);color:var(--gold);background:var(--highlight)}
.skill-tab img{width:18px;height:18px;image-rendering:pixelated}

/* Price refresh */
.refresh-btn{background:#21180f;border:2px ridge var(--panel-border);color:var(--muted);padding:.2rem .6rem;border-radius:2px;cursor:pointer;font-size:.75rem;margin-left:.5rem;font-family:inherit}
.refresh-btn:hover{color:var(--gold);border-color:var(--gold)}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hide-tablet{display:table-cell}
.bonus-toggles{display:flex;flex-wrap:wrap;gap:.4rem .8rem;margin-bottom:.6rem}
.bonus-toggles:empty{display:none}
.bonus-toggles label{color:var(--muted);font-size:.82rem;cursor:pointer;display:flex;align-items:center;gap:.3rem;background:rgba(216,189,134,.06);border:1px solid var(--panel-border);border-radius:2px;padding:.25rem .6rem}
.bonus-toggles label:hover{border-color:var(--gold);color:var(--text)}
.bonus-toggles input:checked+span{color:var(--positive)}
.custom-xp-row{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;margin-bottom:.5rem}
.custom-xp-row label{color:var(--muted);font-size:.85rem;display:flex;align-items:center;gap:.3rem}
.custom-xp-row input{background:#0f0b07;border:2px ridge var(--panel-border);color:var(--text);padding:.3rem .5rem;border-radius:2px;width:80px;font-size:.85rem;font-family:inherit}
.custom-xp-row input:focus{border-color:var(--gold);outline:none}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--panel-border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="container">
    <img class="osrs-logo" src="https://oldschool.runescape.wiki/images/Old_School_RuneScape_logo.png" alt="Old School RuneScape">
    <h1>Skill Calculator</h1>
    <p style="color:var(--muted);margin-bottom:1rem;font-size:.9rem">XP/GP Calculator with Live RuneLite/Wiki Grand Exchange Prices</p>
    <div class="search-row">
      <input type="text" id="username-input" placeholder="Enter RSN" autocomplete="off">
      <button id="lookup-btn">Lookup Player</button>
    </div>
    <div id="price-status">Loading prices...</div>
  </div>
</header>

<div class="container">
  <div id="error-msg" class="hidden"></div>
  <div id="loading" class="hidden"><span class="spinner"></span> Loading...</div>

  <section id="player-section" class="hidden">
    <div id="player-header">
      <h2 id="player-name"></h2>
      <span class="combat-level" id="combat-level"></span>
      <span class="quest-points" id="quest-points"></span>
    </div>
    <div id="stats-grid"></div>
  </section>

  <div id="no-player">
    <h2>Enter a username above to see player stats</h2>
    <p>Or browse training methods by skill below</p>
  </div>

  <div class="skill-tabs" id="skill-tabs"></div>

  <section id="methods-section" class="hidden">
    <div class="methods-header">
      <h2 id="skill-title">Training Methods</h2>
      <div class="methods-controls">
        <label><input type="checkbox" id="filter-level"> Available only</label>
        <label>Target lvl: <input type="number" id="target-level" min="2" max="99" value="99"></label>
        <select id="sort-by">
          <option value="level">Sort: Level</option>
          <option value="gpxp">Sort: GP/XP</option>
          <option value="xp">Sort: XP/Action</option>
          <option value="cost">Sort: Cost</option>
          <option value="xphr">Sort: XP/hr</option>
          <option value="time">Sort: Time</option>
          <option value="gphr">Sort: GP/hr</option>
        </select>
      </div>
    </div>
    <div class="custom-xp-row" id="custom-xp-row">
      <label>Current lvl: <input type="number" id="current-level" min="1" max="98" placeholder="1"></label>
      <label>or XP: <input type="number" id="current-xp" min="0" max="200000000" placeholder="0"></label>
      <label>XP bonus: <input type="number" id="xp-bonus" min="0" max="100" value="0" step="0.5" style="width:55px">%</label>
    </div>
    <div id="bonus-toggles" class="bonus-toggles"></div>
    <div id="xp-info"></div>
    <div id="methods-container"></div>
  </section>
</div>

<script>
// ── XP Table ──
const XP_TABLE = [0];
(function(){
  let acc = 0;
  for(let i=1;i<100;i++){
    acc += Math.floor(i + 300*Math.pow(2,i/7));
    XP_TABLE.push(Math.floor(acc/4));
  }
})();
function levelForXp(xp){for(let l=98;l>=1;l--)if(xp>=XP_TABLE[l])return l+1;return 1}
function xpForLevel(l){return l<2?0:XP_TABLE[l-1]}

// ── Skills Config ──
const SKILLS = [
  'Overall','Attack','Defence','Strength','Hitpoints','Ranged','Prayer','Magic',
  'Cooking','Woodcutting','Fletching','Fishing','Firemaking','Crafting',
  'Smithing','Mining','Herblore','Agility','Thieving','Slayer','Farming',
  'Runecraft','Hunter','Construction','Sailing'
];
const SKILL_ICON = s => `https://oldschool.runescape.wiki/images/${s}_icon.png`;
const HISCORE_SKILLS = [
  'Overall','Attack','Defence','Strength','Hitpoints','Ranged','Prayer','Magic',
  'Cooking','Woodcutting','Fletching','Fishing','Firemaking','Crafting',
  'Smithing','Mining','Herblore','Agility','Thieving','Slayer','Farming',
  'Runecraft','Hunter','Construction','Sailing'
];
const WOM_SKILL_KEYS = {
  Runecraft: 'runecrafting'
};

// ── Training Methods Database ──
// Each: {name, skill, level, xp, category, inputs:[{id,name,qty}], outputs:[{id,name,qty}], notes?}
const METHODS = [
  // ════ FARMING ════
  // Trees
  {name:'Oak tree',skill:'Farming',level:15,xp:467.3,category:'Trees',
    inputs:[{id:5370,name:'Oak sapling',qty:1},{id:5968,name:'Tomatoes(5)',qty:1}],outputs:[]},
  {name:'Willow tree',skill:'Farming',level:30,xp:1456.5,category:'Trees',
    inputs:[{id:5371,name:'Willow sapling',qty:1},{id:5386,name:'Apples(5)',qty:1}],outputs:[]},
  {name:'Maple tree',skill:'Farming',level:45,xp:3403.4,category:'Trees',
    inputs:[{id:5372,name:'Maple sapling',qty:1},{id:5396,name:'Oranges(5)',qty:1}],outputs:[]},
  {name:'Yew tree',skill:'Farming',level:60,xp:7069.9,category:'Trees',
    inputs:[{id:5373,name:'Yew sapling',qty:1},{id:6016,name:'Cactus spine',qty:10}],outputs:[]},
  {name:'Magic tree',skill:'Farming',level:75,xp:13913.8,category:'Trees',
    inputs:[{id:5374,name:'Magic sapling',qty:1},{id:5974,name:'Coconut',qty:25}],outputs:[]},
  // Fruit Trees
  {name:'Pineapple tree',skill:'Farming',level:51,xp:4605.7,category:'Fruit Trees',
    inputs:[{id:5500,name:'Pineapple sapling',qty:1},{id:5982,name:'Watermelon',qty:10}],outputs:[]},
  {name:'Papaya tree',skill:'Farming',level:57,xp:6146.4,category:'Fruit Trees',
    inputs:[{id:5501,name:'Papaya sapling',qty:1},{id:2114,name:'Pineapple',qty:10}],outputs:[]},
  {name:'Palm tree',skill:'Farming',level:68,xp:10150.1,category:'Fruit Trees',
    inputs:[{id:5502,name:'Palm sapling',qty:1},{id:5972,name:'Papaya fruit',qty:15}],outputs:[]},
  // Herbs (per seed, ~8.5 avg yield w/ ultracompost)
  {name:'Ranarr herbs (avg 8.5)',skill:'Farming',level:32,xp:286.3,category:'Herbs',
    inputs:[{id:5295,name:'Ranarr seed',qty:1},{id:21483,name:'Ultracompost',qty:1}],
    outputs:[{id:207,name:'Grimy ranarr weed',qty:8.5}]},
  {name:'Snapdragon herbs (avg 8.5)',skill:'Farming',level:62,xp:284.8,category:'Herbs',
    inputs:[{id:5300,name:'Snapdragon seed',qty:1},{id:21483,name:'Ultracompost',qty:1}],
    outputs:[{id:3051,name:'Grimy snapdragon',qty:8.5}]},
  {name:'Torstol herbs (avg 8.5)',skill:'Farming',level:85,xp:289.5,category:'Herbs',
    inputs:[{id:5304,name:'Torstol seed',qty:1},{id:21483,name:'Ultracompost',qty:1}],
    outputs:[{id:219,name:'Grimy torstol',qty:8.5}]},

  // ════ HERBLORE ════
  {name:'Attack potion',skill:'Herblore',level:3,xp:25,category:'Potions',
    inputs:[{id:91,name:'Guam potion (unf)',qty:1},{id:221,name:'Eye of newt',qty:1}],
    outputs:[{id:121,name:'Attack potion(3)',qty:1}]},
  {name:'Strength potion',skill:'Herblore',level:12,xp:50,category:'Potions',
    inputs:[{id:95,name:'Tarromin potion (unf)',qty:1},{id:225,name:'Limpwurt root',qty:1}],
    outputs:[{id:115,name:'Strength potion(3)',qty:1}]},
  {name:'Prayer potion',skill:'Herblore',level:38,xp:87.5,category:'Potions',
    inputs:[{id:99,name:'Ranarr potion (unf)',qty:1},{id:231,name:'Snape grass',qty:1}],
    outputs:[{id:139,name:'Prayer potion(3)',qty:1}]},
  {name:'Super attack',skill:'Herblore',level:45,xp:100,category:'Potions',
    inputs:[{id:101,name:'Irit potion (unf)',qty:1},{id:221,name:'Eye of newt',qty:1}],
    outputs:[{id:145,name:'Super attack(3)',qty:1}]},
  {name:'Super strength',skill:'Herblore',level:55,xp:125,category:'Potions',
    inputs:[{id:105,name:'Kwuarm potion (unf)',qty:1},{id:225,name:'Limpwurt root',qty:1}],
    outputs:[{id:157,name:'Super strength(3)',qty:1}]},
  {name:'Super restore',skill:'Herblore',level:63,xp:142.5,category:'Potions',
    inputs:[{id:3004,name:'Snapdragon potion (unf)',qty:1},{id:223,name:'Red spiders\' eggs',qty:1}],
    outputs:[{id:3026,name:'Super restore(3)',qty:1}]},
  {name:'Super defence',skill:'Herblore',level:66,xp:150,category:'Potions',
    inputs:[{id:107,name:'Cadantine potion (unf)',qty:1},{id:239,name:'White berries',qty:1}],

// ── State ──
let prices = {};
let priceMap = {};  // id -> {high, low, avg}
let playerData = null;
let selectedSkill = null;
let pricesLoaded = false;
const PRICE_API_URL = 'https://prices.runescape.wiki/api/v1/osrs/latest';
const MATERIAL_COST_MULTIPLIER = 1.05;
const SELL_MULTIPLIER = 0.95 * 0.98; // 5% under GE price + 2% sales tax

// ── API: Fetch Prices ──
async function fetchPrices(){
  const statusEl = document.getElementById('price-status');
  statusEl.textContent = 'Fetching live prices from the RuneLite/Wiki API...';
  try {
    const res = await fetch(PRICE_API_URL,{
      headers:{'User-Agent':'OSRS-Skill-Calculator-WebApp'}
    });
    if(!res.ok) throw new Error('Price API returned '+res.status);
    const json = await res.json();
    prices = json.data;
    for(const [id,p] of Object.entries(prices)){
      const high = p.high || 0;
      const low = p.low || 0;
      const avg = high && low ? Math.round((high+low)/2) : (high||low);
      priceMap[id] = {high,low,avg};
    }
    pricesLoaded = true;
    const now = new Date();
    statusEl.innerHTML = `RuneLite/Wiki prices loaded (${Object.keys(prices).length.toLocaleString()} items) &mdash; 5% buy buffer + 2% GE sales tax on sells &mdash; ${now.toLocaleTimeString()} <button class="refresh-btn" onclick="fetchPrices()">Refresh</button>`;
    if(selectedSkill) renderMethods(selectedSkill);
  } catch(e){
    statusEl.textContent = 'Failed to load prices: '+e.message+'. Costs will show as N/A.';
    console.error('Price fetch error:',e);
  }
}

function getPrice(id){
  if(id===995) return 1; // Coins are not listed in the Wiki GE mapping.
  if(!priceMap[id]) return null;
  return priceMap[id].avg;
}

      let res = await fetch(`https://api.wiseoldman.net/v2/players/${encodeURIComponent(username)}`);
    if(res.status===404){
      // Try to track the player
      const trackRes = await fetch('https://api.wiseoldman.net/v2/players',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username})
      });
      if(trackRes.ok){
        const tracked = await trackRes.json();
        loadEl.classList.add('hidden');
        return parseWomPlayer(tracked);
      }
      throw new Error('Player not found');
    }
    if(!res.ok) throw new Error('WOM API error: '+res.status);
    const data = await res.json();
    loadEl.classList.add('hidden');
    return parseWomPlayer(data);
    } catch(e2){
      loadEl.classList.add('hidden');
      errEl.textContent = `Could not find player "${username}". Check spelling or try again later.`;
      errEl.classList.remove('hidden');
      return null;
    }
  }
}

async function fetchPlayerHiscores(username){
  const loadEl = document.getElementById('loading');
  const errEl = document.getElementById('error-msg');
  const targetUrl = 'https://secure.runescape.com/m=hiscore_oldschool/index_lite.json?player=' + encodeURIComponent(username);
  const proxyUrls = [
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
    `https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`
  ];
  let text = '';
  let lastError = null;
  for(const proxyUrl of proxyUrls){
    try{
      const res = await fetch(proxyUrl);
      text = await res.text();
      if(!res.ok) throw new Error('Hiscores proxy error '+res.status);
      if(/server-side requests are not allowed|internal server error/i.test(text)){
        throw new Error('Hiscores proxy rejected request');
      }
      break;
    } catch(e){
      lastError = e;
      text = '';
    }
  }
  if(!text) throw lastError || new Error('Hiscores error');
  loadEl.classList.add('hidden');
  try {
    const json = JSON.parse(text);
    return parseHiscoresJson(json, username);
  } catch(e){
    return parseHiscoresText(text, username);
  }
}

function normalizeHiscoreSkillName(name){
  if(!name) return null;
  const cleaned = String(name).trim().toLowerCase().replace(/\s+/g,' ');
  const aliases = {
    overall:'Overall',
    attack:'Attack',
    defence:'Defence',
    strength:'Strength',
    hitpoints:'Hitpoints',
    ranged:'Ranged',
    prayer:'Prayer',
    magic:'Magic',
    cooking:'Cooking',
    woodcutting:'Woodcutting',
    fletching:'Fletching',
    fishing:'Fishing',
    firemaking:'Firemaking',
    crafting:'Crafting',
    smithing:'Smithing',
    mining:'Mining',
    herblore:'Herblore',
    agility:'Agility',
    thieving:'Thieving',
    slayer:'Slayer',
    farming:'Farming',
    runecraft:'Runecraft',
    runecrafting:'Runecraft',
    hunter:'Hunter',
    construction:'Construction',
    sailing:'Sailing'
  };
  return aliases[cleaned] || null;
}

function parseWomPlayer(data){
  const snap = data.latestSnapshot?.data?.skills || data.data?.skills;
  if(!snap) return null;
  const skills = {};
  for(const s of SKILLS){
    if(s==='Overall') continue;
    const key = WOM_SKILL_KEYS[s] || s.toLowerCase();
    if(snap[key]){
      skills[s] = {level:snap[key].level||1, xp:snap[key].experience||0, rank:snap[key].rank||-1};
    } else {
      skills[s] = {level:1, xp:0, rank:-1};
    }
  }
  const overall = snap.overall || {};
  return {
    username: data.displayName || data.username,
    skills,
    totalLevel: overall.level || Object.values(skills).reduce((a,s)=>a+s.level,0),
    totalXp: overall.experience || 0,
    combatLevel: data.combatLevel || calcCombat(skills),
    questPoints: null
  };
}

function parseHiscoresJson(json, username){
  const skills = {};
  if(json.skills) {
    for(let i=0;i<json.skills.length&&i<HISCORE_SKILLS.length;i++){
      const s = json.skills[i];
      const skillName = normalizeHiscoreSkillName(s.name) || HISCORE_SKILLS[s.id] || HISCORE_SKILLS[i];
      if(skillName==='Overall') continue;
      skills[skillName] = {level:s.level||1,xp:s.xp||0,rank:s.rank||-1};
    }
  }
  for(const skill of SKILLS) skills[skill] ||= {level:1,xp:0,rank:-1};
  return {
    username,
    skills,
    totalLevel: json.skills?.[0]?.level||Object.values(skills).reduce((a,s)=>a+s.level,0),
    totalXp: json.skills?.[0]?.xp||0,
    combatLevel: calcCombat(skills),
    questPoints: null
  };
}

function parseHiscoresText(text, username){
  const lines = text.trim().split('\n');
  const skills = {};
  for(let i=1;i<HISCORE_SKILLS.length&&i<lines.length;i++){
    const parts = lines[i].split(',');
    skills[HISCORE_SKILLS[i]] = {rank:+parts[0]||-1,level:+parts[1]||1,xp:+parts[2]||0};
  }
  for(const skill of SKILLS) skills[skill] ||= {level:1,xp:0,rank:-1};
  const overallParts = lines[0]?.split(',') || [];
  return {
    username,
    skills,
    totalLevel: +overallParts[1]||0,
    totalXp: +overallParts[2]||0,
    combatLevel: calcCombat(skills),
    questPoints: null
  };
}

function calcCombat(skills){
  const g = s => skills[s]?.level||1;
  const base = 0.25*(g('Defence')+g('Hitpoints')+Math.floor(g('Prayer')/2));
  const melee = 0.325*(g('Attack')+g('Strength'));
  const range = 0.325*(Math.floor(g('Ranged')*3/2));
  const mage = 0.325*(Math.floor(g('Magic')*3/2));
  return Math.floor(base+Math.max(melee,range,mage));
}

// ── Calculations ──
function calcMethodCost(method){
  let inputCost = 0, outputValue = 0;
  let hasUnknown = false;
  for(const inp of method.inputs){
    const p = getPrice(inp.id);
    if(p===null){hasUnknown=true;continue;}
    inputCost += p * inp.qty * MATERIAL_COST_MULTIPLIER;
  }
  for(const out of method.outputs){
    const p = getPrice(out.id);
    if(p===null){hasUnknown=true;continue;}
    outputValue += p * out.qty * SELL_MULTIPLIER;
  }
  const netCost = inputCost - outputValue;
  const gpPerXp = method.xp > 0 ? netCost / method.xp : 0;
  const note = (method.notes || '').toLowerCase();
  const noMarketItems = method.inputs.length === 0 && method.outputs.length === 0;
  const variableCost = method.variableCost || (noMarketItems && /varies|variable|scales|reward|loot|drops|output|points|contract|team|minigame|not tradeable|untradeable/.test(note));
  return {inputCost, outputValue, netCost, gpPerXp, hasUnknown, variableCost, noMarketItems};
}

function selectSkill(skill){
  selectedSkill = skill;

  document.getElementById('no-player').classList.add('hidden');

  document.querySelectorAll('.skill-card,.skill-tab').forEach(el=>{

function renderMethods(skill){
  const section = document.getElementById('methods-section');
  if(skill === 'Overall'){
    renderBonusToggles(null);
    renderOverallMethods();
    return;
  }
  renderBonusToggles(skill);
  const methods = METHODS.filter(m=>m.skill===skill);
  if(methods.length===0){
    section.classList.remove('hidden');
    document.getElementById('skill-title').textContent = skill + ' Training Methods';
    document.getElementById('xp-info').innerHTML = '<span>No item-based training methods in database for this skill.</span>';
    document.getElementById('methods-container').innerHTML = '';
    return;
  }
  section.classList.remove('hidden');
  document.getElementById('skill-title').textContent = skill + ' Training Methods';

  // XP Info — use custom input, then player data, then nothing
  const xpInfoEl = document.getElementById('xp-info');
  const customSkill = getCustomXp(skill);
  const playerSkill = customSkill;
  const targetLvl = Math.min(99, Math.max(2, parseInt(document.getElementById('target-level').value)||99));
  const xpBonus = getXpBonus();
  if(playerSkill){
    const currentXp = playerSkill.xp;
    const targetXp = xpForLevel(targetLvl);
    const remaining = Math.max(0, targetXp - currentXp);
    const bonusStr = xpBonus > 0 ? ` <span style="color:var(--positive)">(+${(xpBonus*100).toFixed(1)}% XP bonus)</span>` : '';
    xpInfoEl.innerHTML = `
      <div><span>Level:</span> <strong>${playerSkill.level}</strong></div>
      <div><span>Current XP:</span> <strong>${currentXp.toLocaleString()}</strong></div>
      <div><span>XP to ${targetLvl}:</span> <strong>${remaining.toLocaleString()}</strong>${bonusStr}</div>
      <div><span>Target XP:</span> <strong>${targetXp.toLocaleString()}</strong></div>`;
  } else {
    xpInfoEl.innerHTML = '<span>Enter a current level above, or look up a player, to see personalized XP calculations</span>';
  }

  // Filter & sort
  const filterLevel = document.getElementById('filter-level').checked;
  const sortBy = document.getElementById('sort-by').value;
  let filtered = methods.map(m=>{
    const calc = calcMethodCost(m);
    const xphr = estimateXphr(m);
    const effectiveXp = m.xp * (1 + xpBonus);
    let _time = null;
    if(xphr && effectiveXp > 0 && playerSkill){
      const remaining = Math.max(0, xpForLevel(targetLvl) - playerSkill.xp);
      _time = remaining / (xphr * (1 + xpBonus));
    }
    let _gphr = null;
    if(xphr && effectiveXp > 0 && !calc.hasUnknown && !calc.noMarketItems){
      const actionsPerHr = (xphr * (1 + xpBonus)) / effectiveXp;
      _gphr = -calc.netCost * actionsPerHr;
    }
    return {...m,...calc, _xphr:xphr, _time, _gphr};
  });
  if(filterLevel && playerSkill){
    filtered = filtered.filter(m=>m.level<=playerSkill.level);
  }

  switch(sortBy){
    case 'gpxp': filtered.sort((a,b)=>(a.variableCost||a.hasUnknown)-(b.variableCost||b.hasUnknown) || a.gpPerXp-b.gpPerXp); break;
    case 'xp': filtered.sort((a,b)=>b.xp-a.xp); break;
    case 'cost': filtered.sort((a,b)=>(a.variableCost||a.hasUnknown)-(b.variableCost||b.hasUnknown) || a.netCost-b.netCost); break;
    case 'xphr': filtered.sort((a,b)=>(b._xphr||0)-(a._xphr||0)); break;
    case 'time': filtered.sort((a,b)=>(a._time||Infinity)-(b._time||Infinity)); break;
    case 'gphr': filtered.sort((a,b)=>(b._gphr||0)-(a._gphr||0)); break;
    default: filtered.sort((a,b)=>a.level-b.level);
  }

  // Group by category if sorted by level
  const container = document.getElementById('methods-container');
  container.innerHTML = '';

  if(sortBy==='level'){
    const categories = [];
    const catMap = new Map();
    for(const m of filtered){
      if(!catMap.has(m.category)){
        catMap.set(m.category,[]);
        categories.push(m.category);
      }
      catMap.get(m.category).push(m);
    }
    for(const cat of categories){
      const header = document.createElement('div');
      header.className = 'category-header';
      header.textContent = cat;
      container.appendChild(header);
      container.appendChild(buildMethodsTable(catMap.get(cat), playerSkill, targetLvl));
    }
  } else {
    container.appendChild(buildMethodsTable(filtered, playerSkill, targetLvl));
  }
}

  document.getElementById('xp-info').innerHTML = '<span>Best current profit per action across all methods using live RuneLite/Wiki prices. Includes 5% buy buffer and 2% GE sales tax on sells.</span>';

// ── XP/hr Estimation ──
const SKILL_RATES = {
  'Potions':2500,'Cleaning Herbs':2800,'Swamp Tars':2500,'Divine Potions':2500,
  'Gem Cutting':2800,'Glass':2000,'Spinning':1500,
  'Smelting':900,'Blast Furnace':4600,'Platebodies':180,'Dart Tips':600,'Unfinished Bolts':600,
  'Knives':600,
  'Dragonhide':1800,'Leather':1800,'Dragonhide Shields':1200,'Jewellery':1800,'Silver':1500,
  'Battlestaves':1400,'Pottery':1400,
  'Bows':1500,'Stringing':1500,'Crossbow Stocks':1500,'Crossbows':1200,
  'Darts':2700,'Arrows':2700,'Ammo':2700,'Bolt Tipping':2700,'Amethyst':2700,
  'Shields':1500,'Javelins':2700,
  'Burying':1800,'Ashes':1800,'Gilded Altar':500,'Chaos Altar':500,'Ensouled Heads':200,
  'Furniture':420,'Planks':420,'Mahogany Homes':6,'Garden':420,'Costume Room':420,
  'Runes':110,'Combination Runes':110,
};
const COOKING_RATE = 1350;
const FM_LOG_RATE = 500;

function estimateXphr(method){
  if(method.xphr) return method.xphr;
  const notes = (method.notes||'');
  const match = notes.match(/~?([\d,.]+)\s*k\s*xp\s*\/\s*hr/i);
  if(match) return parseFloat(match[1].replace(/,/g,'')) * 1000;
  const matchM = notes.match(/~?([\d,.]+)\s*[Mm]\s*xp\s*\/\s*hr/i);
  if(matchM) return parseFloat(matchM[1].replace(/,/g,'')) * 1000000;
  if(SKILL_RATES[method.category]) return method.xp * SKILL_RATES[method.category];
  if(method.skill==='Cooking' && ['Fish','Other','Pies','Pizzas'].includes(method.category)) return method.xp * COOKING_RATE;
  if(method.skill==='Firemaking' && method.category==='Logs') return method.xp * FM_LOG_RATE;
  return null;
}

function formatXphr(v){ if(!v) return '-'; if(v>=1e6) return (v/1e6).toFixed(1)+'M'; if(v>=1e3) return (v/1e3).toFixed(0)+'K'; return Math.round(v).toLocaleString(); }
function formatTime(hours){
  if(!hours || hours<=0 || !isFinite(hours)) return '-';
  if(hours<1) return Math.ceil(hours*60)+'m';
  if(hours<100) return hours.toFixed(1)+'h';
  return (hours/24).toFixed(1)+'d';
}
function formatGphr(v){ if(!v || !isFinite(v)) return '-'; const abs=Math.abs(v); const sign=v>0?'+':'-'; if(abs>=1e6) return sign+(abs/1e6).toFixed(1)+'M'; if(abs>=1e3) return sign+(abs/1e3).toFixed(0)+'K'; return sign+Math.round(abs); }

    for(const out of m.outputs){
      const p = getPrice(out.id);
      const pStr = p!==null ? ` @${formatGp(p * SELL_MULTIPLIER)}` : '';
      matParts.push(`→ ${out.qty > 1 ? out.qty+'× ':''}${out.name}${pStr}`);
    }
    const matStr = matParts.length > 0 ? matParts.join(' + ') : (m.noMarketItems ? 'No direct item cost' : (m.notes||'No items'));
    const displayName = options.showSkill ? `${m.name} <span class="skill-chip">${m.skill}</span>` : m.name;

    tr.innerHTML = `
      <td><div class="method-name">${displayName}</div><div class="materials">${matStr}${m.notes&&matParts.length?' | '+m.notes:''}</div></td>
      <td class="num">${m.level}</td>
      <td class="num hide-mobile">${xpStr}</td>
      <td class="num ${costClass}">${costStr}</td>
      <td class="num hide-tablet ${gpxpClass}">${gpxpStr}</td>
      <td class="num hide-tablet ${netClass}">${netStr}</td>
      <td class="num hide-mobile">${xphrStr}</td>
      <td class="num hide-tablet">${actionsStr}</td>
      <td class="num">${timeStr}</td>
      <td class="num ${totalGpClass}">${totalGpStr}</td>
      <td class="num hide-mobile ${gphrClass}">${gphrStr}</td>`;
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  wrap.appendChild(table);
  return wrap;
}

// ── Formatters ──
function formatGp(gp){
  if(gp===0) return '0';
  const sign = gp > 0 ? '' : '+';  // positive cost = spending = bad, negative = earning = good
  const abs = Math.abs(gp);
  if(abs>=1e6) return sign + (abs/1e6).toFixed(1)+'M';
  if(abs>=1e3) return sign + (abs/1e3).toFixed(1)+'K';
  return sign + Math.round(abs).toLocaleString();
}

function formatNetGp(gp){
  if(gp===0) return '0';
  const sign = gp > 0 ? '+' : '-';
  const abs = Math.abs(gp);
  if(abs>=1e6) return sign + (abs/1e6).toFixed(1)+'M';
  if(abs>=1e3) return sign + (abs/1e3).toFixed(1)+'K';
  return sign + Math.round(abs).toLocaleString();
}

function formatGpXp(gpxp){
  if(gpxp===0) return '0';
  const val = gpxp.toFixed(2);
  return (gpxp > 0 ? '' : '+') + Math.abs(gpxp).toFixed(2) + ' gp/xp';
}
